name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Get the WinFsp SDK
        shell: pwsh
        run: |
          $sdk = ./scripts/get-winfsp-sdk.ps1
          "WINFSP_SDK=$sdk" >> $env:GITHUB_ENV

      - name: Get the Dokan SDK
        shell: pwsh
        run: |
          $sdk = ./scripts/get-dokan-sdk.ps1
          "DOKAN_SDK=$sdk" >> $env:GITHUB_ENV

      - name: Build
        shell: pwsh
        run: ./build.ps1 -Backend all -WinFsp $env:WINFSP_SDK -Dokan $env:DOKAN_SDK

      # Needs no driver: the DLLs are delay-loaded and --version exits first.
      - name: Check the binaries start
        shell: pwsh
        run: |
          $out = ./pipe-file-mount-winfsp.exe --version
          if ($LASTEXITCODE -ne 0 -or $out -notmatch '^pipe-file-mount \d') { throw "unexpected output: $out" }
          $out
          foreach ($b in 'winfsp', 'dokan') {
            $out = & "./PipeFileService-$b.exe" --version
            if ($LASTEXITCODE -ne 0 -or $out -notmatch '^PipeFileService \d') { throw "unexpected output: $out" }
            $out
          }

      # The same packaging a release uses; checked with GNU sha256sum, which
      # rejects CRLF checksum files.
      - name: Package and verify the checksums
        shell: pwsh
        run: |
          ./scripts/release.ps1 -WinFsp $env:WINFSP_SDK -Dokan $env:DOKAN_SDK
          bash -c 'cd dist && sha256sum -c SHA256SUMS'
          if ($LASTEXITCODE -ne 0) { throw 'checksum verification failed' }
