name: release

# Push a tag such as v0.1.0 (or v0.1.0-rc.1 for a pre-release) to publish.
# The tag must match BRIDGE_VERSION in src\winfsp-pipe-bridge.c.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write      # sign the build attestation
  attestations: write  # store it

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Get the WinFsp SDK
        shell: pwsh
        run: |
          $sdk = ./scripts/get-winfsp-sdk.ps1
          "WINFSP_SDK=$sdk" >> $env:GITHUB_ENV

      - name: Build and package
        shell: pwsh
        run: ./scripts/release.ps1 -Tag $env:GITHUB_REF_NAME -WinFsp $env:WINFSP_SDK

      # Signed statement that these files were built by this workflow from this
      # tag; check with: gh attestation verify <zip> -R kihneman/winfsp-pipe-bridge
      - name: Attest the build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.zip
            dist/SHA256SUMS

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $zip = Get-ChildItem dist -Filter *.zip | Select-Object -First 1
          $ghArgs = @($tag, $zip.FullName, 'dist/SHA256SUMS', '--title', "winfsp-pipe-bridge $($tag.Substring(1))", '--notes-file', 'dist/RELEASE_NOTES.md', '--verify-tag')
          if ($tag -match '-') { $ghArgs += '--prerelease' }
          gh release create @ghArgs
